 <!-- Botõa + -->

<!-- =============================================== -->

<div class="container mt-4">

  <!-- Lista de Frutas -->
  <div class="row" id="listaFrutas"></div>

</div>

<!-- ================= MODAL CADASTRO ================= -->
<div class="modal fade" id="modalFruta" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <form id="formFruteira">
        <div class="modal-header">
          <h5 class="modal-title">Cadastrar Fruteira</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Espécie</label>
            <input type="text" id="especie" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nome Científico</label>
            <input type="text" id="nomeCientifico" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Produção Média (Kg)</label>
            <input type="number" id="producao" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Data do Plantio (dd/mm/aaaa)</label>
            <input type="text" id="dataPlantio" class="form-control" placeholder="dd/mm/aaaa" required>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>
      </form>

    </div>
  </div>
</div>
